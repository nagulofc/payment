<!DOCTYPE html>
<html>
<head>
<title>WhatsApp Statuses</title>
</head>
<body>

<h1>WhatsApp Statuses</h1>

<div id="status-container">
  </div>

<script>
  // This approach WILL NOT WORK in a standard web browser.
  // Browsers have strict security restrictions that prevent
  // JavaScript from accessing the local file system in this way.

  // This code is ONLY for demonstration purposes to illustrate
  // what you would *conceptually* need to do if such access were possible.

  // To achieve this functionality, you would need a native app
  // (Android/iOS) or a server-side solution.

  function displayStatuses() {
    const statusContainer = document.getElementById('status-container');

    // In a real native app or server-side environment, you would
    // use platform-specific APIs (e.g., File API in Android,
    // NSFileManager in iOS, or server-side file system access)
    // to read the files in the directory.

    // This is a placeholder for the actual file reading logic.
    const statusFiles = [
      "/storage/emulated/0/Android/media/com.whatsapp/WhatsApp/Media/.Statuses/status1.jpg",
      "/storage/emulated/0/Android/media/com.whatsapp/WhatsApp/Media/.Statuses/status2.mp4",
      // ... more status files
    ];

    statusFiles.forEach(filePath => {
      const fileExtension = filePath.split('.').pop().toLowerCase();

      if (fileExtension === 'jpg' || fileExtension === 'jpeg' || fileExtension === 'png') {
        const imgElement = document.createElement('img');
        imgElement.src = filePath; // This would work in native/server context
        imgElement.alt = "Status Image";
        imgElement.style.maxWidth = "200px"; // Limit image width for display
        statusContainer.appendChild(imgElement);
      } else if (fileExtension === 'mp4') {
        const videoElement = document.createElement('video');
        videoElement.src = filePath; // This would work in native/server context
        videoElement.controls = true;
        videoElement.style.maxWidth = "200px";
        statusContainer.appendChild(videoElement);
      }
    });

    // IMPORTANT: In a browser, this will result in errors like:
    // "Not allowed to load local resource: file:///..."
  }

  // Call the function (this will fail in a browser environment)
  displayStatuses();

</script>

</body>
</html>
